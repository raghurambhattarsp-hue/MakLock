name: Build MakLock

on:
  workflow_dispatch:
  push:
    branches:
      - v3-native-auth-window-lock

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Debug
        run: |
          xcodebuild \
            -project MakLock.xcodeproj \
            -scheme MakLock \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build Release
        run: |
          xcodebuild \
            -project MakLock.xcodeproj \
            -scheme MakLock \
            -destination 'platform=macOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
